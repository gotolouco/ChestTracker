name: Release

# Mudou o arquivo VERSION na main: testa, gera o ChestTracker.exe e publica a release v<VERSION>.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    env:
      # Vazio até a SignPath aprovar o projeto: aí o .exe sai sem assinatura, como antes.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Versão
        id: versao
        shell: bash
        run: echo "tag=v$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Dependências
        run: python -m pip install --upgrade pip pynput pyinstaller

      - name: Autoteste
        run: python contador_baus.py --autoteste

      - name: Dados do .exe (nome, versão, autor)
        shell: bash
        run: |
          IFS=. read -r a b c <<< "$(tr -d '[:space:]' < VERSION)"
          v="$a.$b.$c"
          cat > versao.txt <<EOF
          VSVersionInfo(
            ffi=FixedFileInfo(filevers=($a, $b, $c, 0), prodvers=($a, $b, $c, 0), mask=0x3f, flags=0x0,
                              OS=0x40004, fileType=0x1, subtype=0x0, date=(0, 0)),
            kids=[
              StringFileInfo([StringTable('041604B0', [
                StringStruct('CompanyName', 'gotolouco'),
                StringStruct('FileDescription', 'ChestTracker'),
                StringStruct('FileVersion', '$v'),
                StringStruct('InternalName', 'ChestTracker'),
                StringStruct('LegalCopyright', 'Copyright 2026 gotolouco'),
                StringStruct('OriginalFilename', 'ChestTracker.exe'),
                StringStruct('ProductName', 'ChestTracker'),
                StringStruct('ProductVersion', '$v'),
                StringStruct('Comments', 'Contador de baus para Fortnite - github.com/gotolouco/ChestTracker')])]),
              VarFileInfo([VarStruct('Translation', [0x0416, 1200])])
            ]
          )
          EOF

      - name: Gerar .exe
        run: pyinstaller --onefile --noconsole --name ChestTracker --icon assets/chesttracker.ico --add-data "assets/chesttracker.ico;assets" --version-file versao.txt contador_baus.py

      - name: Guardar .exe para assinar
        id: sem_assinatura
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: ChestTracker-sem-assinatura
          path: dist/ChestTracker.exe

      - name: Assinar com SignPath (espera a aprovação manual)
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'ChestTracker' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.sem_assinatura.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: assinado

      - name: Usar o .exe assinado
        if: env.SIGNPATH_API_TOKEN != ''
        shell: bash
        run: cp assinado/ChestTracker.exe dist/ChestTracker.exe

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Baixe o **ChestTracker.exe** abaixo, coloque numa pasta só dele e abra.
            ${{ env.SIGNPATH_API_TOKEN != '' && 'Assinado digitalmente. Free code signing provided by SignPath.io, certificate by SignPath Foundation.' || 'Ainda sem assinatura digital: o Windows pode avisar na primeira vez.' }}
            [Política de assinatura e privacidade](https://github.com/gotolouco/ChestTracker#política-de-assinatura-de-código)
          tag_name: ${{ steps.versao.outputs.tag }}
          name: ChestTracker ${{ steps.versao.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/ChestTracker.exe
          generate_release_notes: true
