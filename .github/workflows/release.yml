name: Release

# Mudou o arquivo VERSION na main: testa, gera o ChestTracker.exe e publica a release v<VERSION>.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Versão
        id: versao
        shell: bash
        run: echo "tag=v$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Dependências
        run: python -m pip install --upgrade pip pynput pyinstaller

      - name: Autoteste
        run: python contador_baus.py --autoteste

      - name: Gerar .exe
        run: pyinstaller --onefile --noconsole --name ChestTracker --icon assets/chesttracker.ico --add-data "assets/chesttracker.ico;assets" contador_baus.py

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versao.outputs.tag }}
          name: ChestTracker ${{ steps.versao.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/ChestTracker.exe
          generate_release_notes: true
